name: Daily public contribution check

on:
  schedule:
    - cron: "47 23 * * *"
      timezone: "America/New_York"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-public-contribution-check
  cancel-in-progress: false

jobs:
  check:
    if: github.repository_owner == 'yomnegede'
    runs-on: ubuntu-latest

    steps:
      - name: Check out the default branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Record a zero-contribution day
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          PROFILE_LOGIN: yomnegede
          TIME_ZONE: America/New_York
        run: |
          set -euo pipefail

          today="$(TZ="$TIME_ZONE" date +%F)"
          month="$(TZ="$TIME_ZONE" date +%Y-%m)"
          timestamp="$(TZ="$TIME_ZONE" date --iso-8601=seconds)"
          day_start="$(TZ="$TIME_ZONE" date --date "${today} 00:00:00" --iso-8601=seconds)"
          day_end="$(TZ="$TIME_ZONE" date --date "${today} 23:59:59" --iso-8601=seconds)"
          output="activity/daily-status/${month}.md"

          if [[ -f "$output" ]] && grep -q "| ${today} |" "$output"; then
            echo "A status entry for ${today} already exists."
            exit 0
          fi

          query='query($login:String!,$from:DateTime!,$to:DateTime!){user(login:$login){contributionsCollection(from:$from,to:$to){contributionCalendar{totalContributions}}}}'
          request="$(jq -n \
            --arg query "$query" \
            --arg login "$PROFILE_LOGIN" \
            --arg from "$day_start" \
            --arg to "$day_end" \
            '{query:$query,variables:{login:$login,from:$from,to:$to}}')"

          response="$(curl --fail --silent --show-error \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Content-Type: application/json" \
            --data "$request" \
            "https://api.github.com/graphql")"

          if [[ "$(jq -r 'has("errors")' <<<"$response")" == "true" ]]; then
            jq -r '.errors' <<<"$response"
            exit 1
          fi

          contributions="$(jq -r '.data.user.contributionsCollection.contributionCalendar.totalContributions' <<<"$response")"

          if [[ "$contributions" != "0" ]]; then
            echo "${PROFILE_LOGIN} already has ${contributions} public contribution(s) for ${today}; no entry needed."
            exit 0
          fi

          mkdir -p "$(dirname "$output")"
          if [[ ! -f "$output" ]]; then
            printf '# Daily public contribution status — %s\n\n' "$month" > "$output"
            printf '| Date | Status | Recorded at |\n' >> "$output"
            printf '|---|---|---|\n' >> "$output"
          fi

          printf '| %s | No public contribution recorded | %s |\n' \
            "$today" "$timestamp" >> "$output"

          actor_id="$(curl --fail --silent --show-error \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/users/${ACTOR}" | jq -r '.id')"

          git config user.name "$ACTOR"
          git config user.email "${actor_id}+${ACTOR}@users.noreply.github.com"
          git add "$output"
          git commit -m "chore: record no public contribution for ${today}"
          git push
