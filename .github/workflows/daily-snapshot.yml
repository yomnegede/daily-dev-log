name: Daily repository snapshot

on:
  schedule:
    - cron: "17 9 * * *"
      timezone: "America/New_York"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-repository-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    if: github.repository_owner == 'yomnegede'
    runs-on: ubuntu-latest

    steps:
      - name: Check out the default branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Record today's repository metadata
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          TIME_ZONE: America/New_York
        run: |
          set -euo pipefail

          today="$(TZ="$TIME_ZONE" date +%F)"
          month="$(TZ="$TIME_ZONE" date +%Y-%m)"
          timestamp="$(TZ="$TIME_ZONE" date --iso-8601=seconds)"
          output="activity/${month}.md"

          if [[ -f "$output" ]] && grep -q "| ${today} |" "$output"; then
            echo "A snapshot for ${today} already exists."
            exit 0
          fi

          metadata="$(curl --fail --silent --show-error \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}")"

          stars="$(jq -r '.stargazers_count' <<<"$metadata")"
          forks="$(jq -r '.forks_count' <<<"$metadata")"
          issues="$(jq -r '.open_issues_count' <<<"$metadata")"
          starting_commit="$(git rev-parse --short HEAD)"

          if [[ ! -f "$output" ]]; then
            printf '# Repository snapshots — %s\n\n' "$month" > "$output"
            printf '| Date | Recorded at | Stars | Forks | Open issues/PRs | Starting commit |\n' >> "$output"
            printf '|---|---|---:|---:|---:|---|\n' >> "$output"
          fi

          printf '| %s | %s | %s | %s | %s | `%s` |\n' \
            "$today" "$timestamp" "$stars" "$forks" "$issues" "$starting_commit" >> "$output"

          actor_id="$(curl --fail --silent --show-error \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/users/${ACTOR}" | jq -r '.id')"

          git config user.name "$ACTOR"
          git config user.email "${actor_id}+${ACTOR}@users.noreply.github.com"
          git add "$output"

          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi

          git commit -m "chore: record repository snapshot for ${today}"
          git push

